<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h1>Controle de Tarefas</h1>
    <p id="week">Semana atual</p>
  </div>

  <div class="tasks">

    <div class="task">
      <p class="task-category">Trabalho</p>
      <p class="task-title">Cotação João — Recife/Gramado</p>
      <p class="task-time">30 min</p>
      <span class="priority priority-high">Alta</span>
    </div>

    <div class="task">
      <p class="task-category">Pessoal</p>
      <p class="task-title">Estudar JavaScript</p>
      <p class="task-time">45 min</p>
      <span class="priority priority-medium">Média</span>
    </div>

    <div class="task">
      <p class="task-category">Pessoal</p>
      <p class="task-title">Estudar Inglês</p>
      <p class="task-time">10 min</p>
      <span class="priority priority-low">Baixa</span>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
